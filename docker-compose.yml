services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afyaclaim
      POSTGRES_PASSWORD: afyaclaim
      POSTGRES_DB: afyaclaim_development
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afyaclaim"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
