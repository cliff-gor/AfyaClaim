name: API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: api

jobs:
  lint:
    name: Lint & security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api # reads api/.ruby-version
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --format github

      - name: Brakeman
        run: bundle exec brakeman --no-pager --quiet --exit-on-warn --exit-on-error

  test:
    name: RSpec
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afyaclaim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/afyaclaim_test
      JWT_SECRET: ci-only-not-a-real-secret
      COVERAGE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run specs
        run: bundle exec rspec --format progress

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            pct=$(ruby -rjson -e 'd=JSON.parse(File.read("coverage/.last_run.json")); puts d.dig("result","line") || d.dig("result","covered_percent")')
            echo "### API line coverage: ${pct}% (target >= 85%)" >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
